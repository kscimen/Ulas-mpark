<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>UlaşımPark Mobil Sensör Ağı — sahne motoru</title>
<style>
  :root{
    --lacivert:#0B1A44; --lacivert2:#12265C; --mavi1:#28439A; --mavi2:#2CA9E1;
    --beyaz:#F4F7FB; --soluk:#A9BCE0; --turkuaz:#5FD4C8; --kehribar:#F2B544; --cizgi:rgba(169,188,224,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--lacivert);font-family:Inter,'Noto Sans',sans-serif;color:var(--beyaz)}
  #stage{position:absolute;inset:0;background:radial-gradient(1200px 700px at 75% 20%, #183274 0%, var(--lacivert) 60%)}
  .scene{position:absolute;inset:0;display:none}
  .abs{position:absolute}
  .grad{background:linear-gradient(115deg,var(--mavi1) 0%,#2a6fc0 55%,var(--mavi2) 100%)}
  .panel{position:absolute;left:0;top:0;width:608px;height:1080px;overflow:hidden;background:#000}
  .panel img{width:608px;height:1080px;display:block}
  .panel .etiket{position:absolute;left:18px;bottom:18px;font-size:16px;letter-spacing:.06em;text-transform:uppercase;
                 background:rgba(5,12,35,.55);padding:6px 10px;border-radius:4px;color:#dfe8f7}
  .sag{position:absolute;left:608px;top:0;right:0;bottom:0}
  h1{font-weight:700;letter-spacing:-.01em}
  .bas{font-size:58px;line-height:1.12;font-weight:700}
  .alt{font-size:28px;color:var(--soluk);font-weight:500}
  .chip{display:inline-block;padding:12px 22px;border:1.5px solid var(--cizgi);border-radius:40px;font-size:26px;margin-right:14px;background:rgba(255,255,255,.04)}
  .ust-logo{position:absolute;right:48px;top:38px;height:50px;opacity:.92}
  .etiket-sol{position:absolute;left:48px;bottom:30px;font-size:17px;letter-spacing:.05em;color:var(--soluk);text-transform:uppercase}
  #altyazi{position:absolute;bottom:36px;left:0;right:0;text-align:center;pointer-events:none}
  #altyazi span{display:inline-block;max-width:1180px;font-size:31px;line-height:1.35;font-weight:500;padding:10px 22px;border-radius:8px;
                background:rgba(4,10,30,.72);color:#fff}
  .kutu{position:absolute;border:1.5px solid var(--cizgi);border-radius:16px;background:rgba(255,255,255,.045)}
  .num{font-weight:800;color:transparent;-webkit-text-stroke:2px var(--mavi2)}
  svg text{font-family:Inter,sans-serif}
  .liste div{font-size:30px;margin:0 0 22px 0;display:flex;align-items:center}
  .liste b{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:var(--mavi1);
           font-size:22px;margin-right:20px;flex:none}
  .kart{position:absolute;width:560px;padding:26px 30px;border-radius:16px;background:rgba(10,22,58,.92);border:1.5px solid var(--cizgi)}
  .kart .k1{font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:var(--soluk)}
  .kart .k2{font-size:34px;font-weight:700;margin:8px 0 12px}
  .kart .k3{font-size:25px;color:#dfe8f7}
  .kart .k4{font-size:27px;font-weight:600;margin-top:14px;color:var(--kehribar)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="altyazi"><span id="altyazi-t" style="display:none"></span></div>
<script>
// ---------- yardımcılar ----------
const TL = window.__TL__;                 // timeline.json (olusturucu tarafından enjekte edilir)
const KARE = window.__KARE__;             // görüntü kare klasörü (file:// yolu)
const ASSET = window.__ASSET__;           // assets klasörü
const W=1920,H=1080;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-cl(x),3);              // ease-out cubic
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const prog=(t,t0,d)=>cl((t-t0)/d);
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild};
const NS='http://www.w3.org/2000/svg';
const stage=document.getElementById('stage');
function show(el,p,dy=24){el.style.opacity=eo(p);el.style.transform=`translateY(${(1-eo(p))*dy}px)`}
const pad=n=>String(n).padStart(4,'0');
const imgWaits=[];
function setImg(img,src){ if(img.dataset.src!==src){img.dataset.src=src; img.src=src; imgWaits.push(img.decode().catch(()=>{}));} }
const fr=(dir,i)=>`${KARE}/${dir}/${pad(i)}.jpg`;
const LOGO=`${ASSET}/up_logo_beyaz.png`;

// ---------- sahne fabrikaları ----------
const builders={};

builders.intro=()=>{
  const el=$(`<div class="scene grad">
    <svg class="abs" width="1920" height="1080" style="left:0;top:0;opacity:.35">
      <path id="i-rota" d="M-40 860 C 300 780, 520 960, 820 860 S 1300 700, 1560 820 S 1900 900, 1980 840" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="4000" stroke-dashoffset="4000"/>
      <circle id="i-nokta" r="9" fill="#fff"/>
    </svg>
    <img id="i-logo" src="${LOGO}" class="abs" style="width:520px;left:700px;top:250px">
    <div id="i-t1" class="abs" style="left:0;right:0;top:600px;text-align:center"><h1 style="font-size:60px">Akıllı Mobil Çevresel İzleme</h1></div>
    <div id="i-t2" class="abs alt" style="left:0;right:0;top:690px;text-align:center;color:#e5efff">UlaşımPark Mobil Sensör Ağı · Proje önerisi · Eğitici sunum</div>
  </div>`); stage.appendChild(el);
  const rota=el.querySelector('#i-rota'), L=rota.getTotalLength(), nk=el.querySelector('#i-nokta');
  return (lt)=>{
    const lg=el.querySelector('#i-logo'); const p=eo(prog(lt,.2,1.2));
    lg.style.opacity=p; lg.style.transform=`scale(${.92+.08*p})`;
    show(el.querySelector('#i-t1'),prog(lt,1.0,.9)); show(el.querySelector('#i-t2'),prog(lt,1.4,.9));
    const d=eio(prog(lt,.3,4.2)); rota.style.strokeDashoffset=L*(1-d);
    const pt=rota.getPointAtLength(L*d); nk.setAttribute('cx',pt.x); nk.setAttribute('cy',pt.y);
  };
};

builders.kart=(sc)=>{
  const el=$(`<div class="scene">
    <div class="abs grad" style="left:0;top:0;width:22px;height:1080px"></div>
    <img src="${LOGO}" class="ust-logo">
    <div class="abs num k-n" style="left:180px;top:250px;font-size:260px;line-height:1">${sc.no}</div>
    <div class="abs k-b" style="left:186px;top:560px"><h1 style="font-size:84px">${sc.baslik}</h1></div>
    <div class="abs k-c" style="left:190px;top:684px;width:0;height:4px" class="grad"></div>
    <div class="abs alt k-a" style="left:188px;top:712px;font-size:34px">${sc.alt}</div>
    <div class="etiket-sol">Bölüm ${sc.no} / 06</div>
  </div>`); stage.appendChild(el);
  const n=el.querySelector('.k-n'),b=el.querySelector('.k-b'),c=el.querySelector('.k-c'),a=el.querySelector('.k-a');
  c.style.background='linear-gradient(90deg,#28439A,#2CA9E1)';
  return (lt)=>{
    const p=eo(prog(lt,.05,.7)); n.style.opacity=p; n.style.transform=`translateX(${(1-p)*-60}px)`;
    show(b,prog(lt,.25,.7),40); c.style.width=(420*eo(prog(lt,.5,.8)))+'px'; show(a,prog(lt,.65,.7));
  };
};

function routeSVG(id,w,h){ // şematik hat ağı
  return `<svg id="${id}" class="abs" width="${w}" height="${h}" viewBox="0 0 1312 1080">
    ${[ 'M60 760 C 300 700 420 820 640 760 S 980 600 1250 640',
        'M120 420 C 340 460 520 380 700 470 S 1000 560 1260 480',
        'M200 980 C 320 820 520 700 600 560 S 760 300 900 160',
        'M720 1000 C 760 860 860 760 1000 720 S 1180 700 1280 820',
        'M40 580 C 260 560 380 620 560 600 S 840 520 1000 360' ].map((d,i)=>
      `<path class="r" d="${d}" fill="none" stroke="${i%2?'#2CA9E1':'#A9BCE0'}" stroke-opacity=".75" stroke-width="3.5" stroke-linecap="round"/>`).join('')}
    ${[0,1,2,3,4,5,6,7].map(i=>`<circle class="d" r="9" fill="#fff"/>`).join('')}
  </svg>`;
}
function routeAnim(svg,lt,t0){
  const rs=[...svg.querySelectorAll('.r')], ds=[...svg.querySelectorAll('.d')];
  rs.forEach((r,i)=>{const L=r.__L||(r.__L=r.getTotalLength()); r.style.strokeDasharray=L; r.style.strokeDashoffset=L*(1-eio(prog(lt,t0+i*.25,1.6)));});
  ds.forEach((d,i)=>{const r=rs[i%rs.length], L=r.__L, ph=((lt*0.06+i*0.37)%1);
    const p=r.getPointAtLength(L*ph); d.setAttribute('cx',p.x); d.setAttribute('cy',p.y); d.style.opacity=eo(prog(lt,t0+1.4+i*.1,.5));});
}

builders.acilis=(sc)=>{
  const el=$(`<div class="scene">
    <div class="panel"><img class="pi"><div class="etiket">Gerçek görüntü · Kocaeli</div></div>
    <div class="sag">${routeSVG('a-r',1312,1080)}
      <div class="abs a-t" style="left:90px;top:150px;width:1000px"><div class="bas">Bir şehir,<br>her gün hareket hâlinde.</div></div>
      <div class="abs a-c" style="left:90px;top:380px">
        <span class="chip">Gün boyu</span><span class="chip">Aynı güzergâhlar</span><span class="chip">Düzenli seferler</span></div>
    </div>
    <img src="${LOGO}" class="ust-logo">
  </div>`); stage.appendChild(el);
  const img=el.querySelector('.pi'), svg=el.querySelector('#a-r');
  return (lt,t)=>{
    const f=Math.floor(lt*30);
    let src; if(f<204) src=fr('g1',f+1); else if(f<252) src=fr('g2a',f-203); else if(f<292) src=fr('g2b',f-251); else src=fr('g1',Math.min(426,205+(f-292)));
    setImg(img,src);
    show(el.querySelector('.a-t'),prog(lt,.5,.9));
    const ch=[...el.querySelectorAll('.chip')]; ch.forEach((c,i)=>show(c,prog(t,sc.ev.otobus+i*.45,.6),16));
    routeAnim(svg,lt,1.0); svg.style.opacity=.45;
  };
};

builders.fikir=(sc)=>{
  const el=$(`<div class="scene">
    <div class="panel"><img class="pi">
      <svg class="abs" width="608" height="1080" style="left:0;top:0"><circle class="ring" cx="318" cy="448" r="60" fill="none" stroke="#5FD4C8" stroke-width="5"/>
      <line class="ln" x1="318" y1="388" x2="318" y2="388" stroke="#5FD4C8" stroke-width="4"/></svg>
      <div class="etiket">Gerçek görüntü · Kocaeli</div></div>
    <div class="sag">
      <div class="abs f-q" style="left:90px;top:170px;width:1050px"><div class="bas" style="font-size:66px">Peki ya otobüsler,<br><span style="color:#2CA9E1">veri de</span> toplasaydı?</div></div>
      <div class="abs f-l liste" style="left:96px;top:470px">
        <div class="alt" style="font-size:24px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:28px">Bu sunumda</div>
        <div><b>1</b>Neler ölçülür?</div><div><b>2</b>Veri nasıl akar?</div><div><b>3</b>Yapay zekâ ne yapar?</div>
        <div><b>4</b>Kullanım senaryoları</div><div><b>5</b>Doğrulama ve pilot</div></div>
    </div>
    <img src="${LOGO}" class="ust-logo">
  </div>`); stage.appendChild(el);
  const img=el.querySelector('.pi'), ring=el.querySelector('.ring'), ln=el.querySelector('.ln');
  return (lt,t)=>{
    const f=Math.floor(lt*30); const k=Math.min(365,300+Math.floor(f/2)); setImg(img,fr('g1',k));
    const hold=(300+Math.floor(f/2))>=365; const tz=lt-(65*2/30);
    const p=hold?eo(prog(tz,.1,.6)):0; ring.style.opacity=p; ring.setAttribute('r',30+40*p+3*Math.sin(lt*5)*p);
    ln.setAttribute('y2',388-160*eo(prog(tz,.4,.6))); ln.style.opacity=p;
    show(el.querySelector('.f-q'),prog(t,sc.ev.soru,.8));
    const it=[...el.querySelectorAll('.f-l > div')]; it.forEach((d,i)=>show(d,prog(t,sc.ev.ajanda+i*.55,.55),14));
  };
};

builders.sensor=(sc)=>{
  // nötr, markasız teknik otobüs çizimi + sensörler
  const S=[ // id, sensör x,y (svg), etiket x,y, başlık, detay, olay
    ['pm',  520,292, 300,110,'Partikül madde','PM2.5 · PM10','pm'],
    ['th',  600,292, 640,110,'Sıcaklık · Nem','Radyasyon kalkanlı','th'],
    ['gaz', 410,300, 40,250,'Gaz yoğunluğu','CH₄ · ön-üst emiş','gaz'],
    ['ses', 470,470, 40,560,'Ses seviyesi','Yalnız dB(A) · kayıt yok','ses'],
    ['tit', 560,690, 300,760,'Yol titreşimi','Şasiye bağlı ivmeölçer','tit'],
    ['gnss',900,286, 990,110,'Konum · Zaman','GNSS + mobil anten','gnss'],
    ['gw',  760,520, 1040,760,'Araç içi veri birimi','Kontrol · paketleme · yerel kayıt','gnss']];
  const el=$(`<div class="scene">
    <div class="abs alt" style="left:120px;top:70px;font-size:24px;letter-spacing:.08em;text-transform:uppercase">Bölüm 02 · Sensör katmanı</div>
    <svg class="abs" width="1700" height="900" viewBox="0 0 1500 900" style="left:110px;top:90px">
      <g class="bus" fill="none" stroke="#DCE6F7" stroke-width="4" stroke-linejoin="round">
        <path class="bp" d="M400 310 Q400 300 412 300 L1380 300 Q1400 300 1402 322 L1410 640 Q1410 668 1384 668 L430 668 Q392 668 392 630 Z"/>
        <path class="bp" d="M430 330 L560 330 L560 480 L430 480 Z"/>
        ${[600,720,840,960,1080,1200,1300].map(x=>`<path class="bp" d="M${x} 330 L${x+100} 330 L${x+100} 440 L${x} 440 Z"/>`).join('')}
        <path class="bp" d="M565 345 L565 640 M605 345 L605 640"/>
        <path class="bp" d="M985 345 L985 640 M1025 345 L1025 640"/>
        <path class="bp" d="M480 300 L480 284 L700 284 L700 300 M860 300 L860 284 L1100 284 L1100 300"/>
        <circle class="bp" cx="680" cy="672" r="58"/><circle class="bp" cx="680" cy="672" r="26"/>
        <circle class="bp" cx="1210" cy="672" r="58"/><circle class="bp" cx="1210" cy="672" r="26"/>
        <path class="bp" d="M300 732 L1500 732" stroke-opacity=".4"/>
      </g>
      <g class="egz" opacity="0"><ellipse cx="1430" cy="650" rx="70" ry="34" fill="#A9BCE0" fill-opacity=".18"/>
        <text x="1342" y="600" fill="#A9BCE0" font-size="22">Egzoz · motor bölgesi</text></g>
      ${S.map(s=>`<g class="sn" data-id="${s[0]}" opacity="0">
        <line x1="${s[1]}" y1="${s[2]}" x2="${s[3]+120}" y2="${s[4]+70}" stroke="#5FD4C8" stroke-width="2" stroke-dasharray="6 6"/>
        <circle class="pu" cx="${s[1]}" cy="${s[2]}" r="16" fill="none" stroke="#5FD4C8" stroke-width="3"/>
        <circle cx="${s[1]}" cy="${s[2]}" r="9" fill="#5FD4C8"/>
        <rect x="${s[3]}" y="${s[4]}" width="290" height="88" rx="12" fill="#0E2155" stroke="rgba(95,212,200,.55)" stroke-width="1.5"/>
        <text x="${s[3]+18}" y="${s[4]+38}" fill="#fff" font-size="26" font-weight="700">${s[5]}</text>
        <text x="${s[3]+18}" y="${s[4]+70}" fill="#A9BCE0" font-size="20">${s[6]}</text></g>`).join('')}
    </svg>
    <div class="abs s-n" style="left:120px;top:110px;font-size:22px;color:#F2B544">Konsept yerleşim — montaj tasarımı teknik onaya tabidir.</div>
    <img src="${LOGO}" class="ust-logo"><div class="etiket-sol" style="bottom:auto;top:1000px;display:none"></div>
  </div>`); stage.appendChild(el);
  const bps=[...el.querySelectorAll('.bp')]; bps.forEach(p=>{p.__L=p.getTotalLength();p.style.strokeDasharray=p.__L});
  const sns=[...el.querySelectorAll('.sn')];
  return (lt,t)=>{
    bps.forEach((p,i)=>p.style.strokeDashoffset=p.__L*(1-eio(prog(lt,.1+i*.06,1.4))));
    sns.forEach((g,i)=>{const ev=S[i][7]; const tt=sc.ev[ev]+(S[i][0]==='gw'?0.9:0)-.15; const p=prog(t,tt,.5); g.setAttribute('opacity',eo(p));
      const pu=g.querySelector('.pu'); pu.setAttribute('r',14+10*((t*1.3+i*.3)%1)); pu.setAttribute('stroke-opacity',1-((t*1.3+i*.3)%1));});
    el.querySelector('.egz').setAttribute('opacity',eo(prog(t,sc.ev.gw,.6))*(1-eo(prog(t,sc.ev.onay+1.5,.6))*.4));
    show(el.querySelector('.s-n'),prog(t,sc.ev.onay,.6),10);
  };
};

builders.veri=(sc)=>{
  const N=[['Sensörler','Ölçüm',110],['Araç içi veri birimi','Kontrol · paketleme',560],['Mobil ağ','Şifreli bağlantı',1010],['Merkezi platform','Saklama · kalite kontrol',1460]];
  const el=$(`<div class="scene">
    <div class="abs alt" style="left:120px;top:70px;font-size:24px;letter-spacing:.08em;text-transform:uppercase">Bölüm 03 · Veri akışı</div>
    <div class="abs v-h" style="left:120px;top:120px;width:1500px"><div class="bas" style="font-size:52px">Her ölçüm, konum ve zaman bilgisiyle sisteme aktarılır.</div></div>
    <svg class="abs" width="1920" height="1080" style="left:0;top:0">
      ${[0,1,2].map(i=>`<line class="cn" data-i="${i}" x1="${N[i][2]+350}" y1="520" x2="${N[i+1][2]}" y2="520" stroke="#2CA9E1" stroke-width="4" opacity="0"/>`).join('')}
      ${Array.from({length:14}).map(()=>`<rect class="pk" width="34" height="22" rx="5" fill="#5FD4C8" opacity="0"/>`).join('')}
      <g class="yok" opacity="0"><circle cx="905" cy="520" r="28" fill="#0B1A44" stroke="#F2B544" stroke-width="3"/>
        <path d="M893 508 L917 532 M917 508 L893 532" stroke="#F2B544" stroke-width="4"/>
        <text x="905" y="590" text-anchor="middle" fill="#F2B544" font-size="24" font-weight="600">Bağlantı yok</text></g>
    </svg>
    ${N.map((n,i)=>`<div class="kutu v-n" style="left:${n[2]}px;top:440px;width:350px;height:160px;padding:30px 28px">
       <div style="font-size:30px;font-weight:700">${n[0]}</div><div class="alt" style="font-size:22px;margin-top:10px">${n[1]}</div></div>`).join('')}
    <div class="abs v-p" style="left:110px;top:660px;display:flex;gap:12px">
      <span class="chip" style="font-size:22px">Ölçüm</span><span class="chip" style="font-size:22px">+ Konum</span><span class="chip" style="font-size:22px">+ Zaman</span></div>
    <div class="abs v-b" style="left:560px;top:660px;width:350px">
      <div class="alt" style="font-size:22px;margin-bottom:10px">Yerel kayıt (tampon)</div>
      <div style="height:22px;border:1.5px solid var(--cizgi);border-radius:6px;overflow:hidden"><div class="v-bar" style="height:100%;width:0;background:#F2B544"></div></div></div>
    <div class="abs alt v-y" style="left:1460px;top:660px;width:360px;font-size:22px">Yakın gerçek zamanlı aktarım</div>
    <img src="${LOGO}" class="ust-logo"><div class="etiket-sol">Konsept görselleştirme</div>
  </div>`); stage.appendChild(el);
  const nodes=[...el.querySelectorAll('.v-n')], cns=[...el.querySelectorAll('.cn')], pks=[...el.querySelectorAll('.pk')];
  return (lt,t)=>{
    const e=sc.ev; show(el.querySelector('.v-h'),prog(lt,.3,.8));
    const nt=[sc.start+.6,e.birim,e.ag,e.ag+.9]; nodes.forEach((n,i)=>show(n,prog(t,nt[i],.6),20));
    cns.forEach((c,i)=>c.setAttribute('opacity',eo(prog(t,nt[i+1]-.2,.5))));
    [...el.querySelectorAll('.v-p .chip')].forEach((c,i)=>show(c,prog(t,e.konum+i*.4,.5),12));
    const down=t>=e.kesinti && t<e.geri;
    el.querySelector('.yok').setAttribute('opacity',down?eo(prog(t,e.kesinti,.4)):1-eo(prog(t,e.geri,.4)));
    cns[1].setAttribute('stroke',down?'#5a6a8f':'#2CA9E1'); cns[1].setAttribute('stroke-dasharray',down?'10 10':'none');
    show(el.querySelector('.v-b'),prog(t,e.kesinti,.5),10);
    const fill = t<e.kesinti?0 : t<e.geri? eo(prog(t,e.kesinti+.3,e.geri-e.kesinti-.3)) : 1-eo(prog(t,e.geri,1.2));
    el.querySelector('.v-bar').style.width=(100*fill)+'%';
    show(el.querySelector('.v-y'),prog(t,e.ag+1.2,.6),10);
    // paketler: birimden platforma akış
    const x0=N[1][2]+350, x1=N[3][2];
    pks.forEach((p,i)=>{
      const ph=((t*0.42)+i/pks.length)%1; let x=x0+(x1-x0)*ph, op=1;
      if(t<e.ag+1.0) op=0;
      if(down && x> x0+60) { op=0 }
      if(x>N[2][2]-10 && x<N[2][2]+360) op=0;
      if(down) { x=x0+50 ; op= i<7? .9:0 }
      p.setAttribute('x',x-17); p.setAttribute('y',509+(down?-((i%7)*26)-40:0)); p.setAttribute('opacity',op);
    });
  };
};

function mapSVG(id,extra=''){ // şematik körfez haritası (gerçek ölçekli değildir)
  return `<svg id="${id}" class="abs" width="1150" height="840" viewBox="0 0 1150 840">
    <rect width="1150" height="840" rx="18" fill="#0F2459"/>
    <path d="M0 360 C 160 380 260 420 380 430 C 520 445 640 440 760 452 C 860 462 960 470 1030 486 C 1060 494 1060 520 1030 526
             C 940 540 820 530 700 528 C 560 526 440 540 320 530 C 200 520 100 560 0 600 Z" fill="#1B4E95" fill-opacity=".85"/>
    <g stroke="#A9BCE0" stroke-opacity=".22" stroke-width="2" fill="none">
      ${[120,240,600,720].map(y=>`<path d="M0 ${y} C 300 ${y-30} 700 ${y+30} 1150 ${y}"/>`).join('')}</g>
    <g class="rt" fill="none" stroke-width="4" stroke-linecap="round">
      <path d="M40 300 C 260 300 420 380 620 390 S 900 410 1110 440" stroke="#2CA9E1"/>
      <path d="M40 690 C 260 640 460 600 640 610 S 920 600 1110 570" stroke="#A9BCE0"/>
      <path d="M980 120 C 990 260 1000 380 1050 460" stroke="#A9BCE0"/>
      <path d="M300 150 C 330 240 380 320 420 390" stroke="#2CA9E1"/>
      <path d="M700 800 C 720 720 760 650 800 600" stroke="#2CA9E1"/></g>
    <g class="pts"></g><g class="heat"></g><g class="rings"></g>${extra}
    <text x="24" y="40" fill="#A9BCE0" font-size="18" letter-spacing="2">ŞEMATİK HARİTA · TEMSİLİ VERİ</text>
  </svg>`;
}
function seedPts(svg,n,seed){
  let s=seed; const r=()=>((s=(s*9301+49297)%233280)/233280);
  const g=svg.querySelector('.pts'); const rts=[...svg.querySelectorAll('.rt path')];
  for(let i=0;i<n;i++){const p=rts[i%rts.length]; const L=p.getTotalLength(); const q=p.getPointAtLength(L*r());
    const c=document.createElementNS(NS,'circle'); c.setAttribute('cx',q.x+(r()-.5)*8); c.setAttribute('cy',q.y+(r()-.5)*8); c.setAttribute('r',5);
    const v=r(); c.setAttribute('fill',v>.85?'#F2B544':v>.55?'#5FD4C8':'#7FA8E8'); c.dataset.k=r(); g.appendChild(c);}
}
function heat(svg,list){ const g=svg.querySelector('.heat'); svg.insertAdjacentHTML('afterbegin',`<defs><radialGradient id="hg${svg.id}"><stop offset="0" stop-color="#F2B544" stop-opacity=".65"/><stop offset="1" stop-color="#F2B544" stop-opacity="0"/></radialGradient></defs>`);
  list.forEach(([x,y,r])=>{const c=document.createElementNS(NS,'circle'); c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',r);c.setAttribute('fill',`url(#hg${svg.id})`);g.appendChild(c);});}

  const rings=[[612,388,'Olağan dışı'],[420,388,'Olağan dışı'],[880,548,'Olağan dışı']];

// ---------- kurulum ----------
const SC = TL.scenes.map(sc=>({sc, el:null, up:null}));
SC.forEach(o=>{ const b=builders[o.sc.type]; o.up=b(o.sc); o.el=stage.lastElementChild; });
const altyazi=document.getElementById('altyazi'), at=document.getElementById('altyazi-t');
const SPLIT=new Set(['acilis','fikir','senaryo']);

window.render = async (t)=>{
  imgWaits.length=0;
  let cur=null;
  SC.forEach(o=>{ const on = t>=o.sc.start && t<o.sc.start+o.sc.dur; o.el.style.display=on?'block':'none'; if(on) cur=o; });
  if(cur){ const lt=t-cur.sc.start; cur.up(lt,t);
    // markaya (lacivert) dip geçiş
    const fin=prog(lt,0,.35), fout=1-prog(lt,cur.sc.dur-.3,.3); cur.el.style.opacity=Math.min(eo(fin),fout);
  }
  const s=TL.subs.find(s=>t>=s.start && t<=s.end);
  if(s){ at.textContent=s.text; at.style.display='inline-block'; altyazi.style.left=(cur&&SPLIT.has(cur.sc.type))?'608px':'0px'; }
  else at.style.display='none';
  await Promise.all(imgWaits);
  await new Promise(r=>requestAnimationFrame(()=>r()));
};
window.__ready = true;
</script>
